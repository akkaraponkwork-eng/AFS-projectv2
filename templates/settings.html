<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0e14">
    <title>AFS - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                </div>
                <h2 class="logo-text">AFS</h2>
            </div>
            
            <div class="sidebar-menu-label">MAIN</div>
            <nav class="sidebar-nav">
                <a href="/">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Dashboard
                </a>
                <a href="/history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Logs History
                </a>
                <a href="/settings" class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>System Settings</h2>
                <div class="topbar-right">
                    <div class="user-profile">
                        <span>{{ username }}</span>
                        <div class="avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                    </div>
                    <a href="/logout" class="icon-btn" style="text-decoration: none; margin-left: 8px; border-color: var(--danger); color: var(--danger);" title="Logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </a>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="card" style="grid-column: span 3; max-width: 800px;">
                    <div class="card-header">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;margin-right:8px;vertical-align:middle;">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                            ตั้งค่าค่าเริ่มต้นสำหรับ Dashboard (Default Presets)
                        </h3>
                    </div>

                    {% if success_msg %}
                    <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        {{ success_msg }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/settings" style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="start_row">Default Start ID</label>
                                <input type="number" id="start_row" name="start_row" value="{{ settings.start_row }}" min="1" required>
                            </div>
                            <div class="input-group">
                                <label for="end_row">Default End ID</label>
                                <input type="number" id="end_row" name="end_row" value="{{ settings.end_row }}" min="1" required>
                            </div>
                            <div class="input-group">
                                <label for="time_period">Default Time</label>
                                <select id="time_period" name="time_period" required>
                                    <option value="morning" {% if settings.time_period == 'morning' %}selected{% endif %}>Morning 🌅</option>
                                    <option value="afternoon" {% if settings.time_period == 'afternoon' %}selected{% endif %}>Afternoon ☀️</option>
                                    <option value="night" {% if settings.time_period == 'night' %}selected{% endif %}>Night 🌇</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="temp_min">Default Min Temp (°C)</label>
                                <input type="number" id="temp_min" name="temp_min" value="{{ settings.temp_min }}" step="0.1" required>
                            </div>
                            <div class="input-group">
                                <label for="temp_max">Default Max Temp (°C)</label>
                                <input type="number" id="temp_max" name="temp_max" value="{{ settings.temp_max }}" step="0.1" required>
                            </div>
                            <div class="input-group">
                                <label for="u_value">Default U Value</label>
                                <select id="u_value" name="u_value" required>
                                    <option value="skip" {% if settings.u_value == 'skip' %}selected{% endif %}>Skip</option>
                                    <option value="0" {% if settings.u_value == '0' %}selected{% endif %}>0</option>
                                    <option value="1" {% if settings.u_value == '1' %}selected{% endif %}>1</option>
                                    <option value="2" {% if settings.u_value == '2' %}selected{% endif %}>2</option>
                                    <option value="3" {% if settings.u_value == '3' %}selected{% endif %}>3</option>
                                    <option value="4" {% if settings.u_value == '4' %}selected{% endif %}>4</option>
                                    <option value="random" {% if settings.u_value == 'random' %}selected{% endif %}>Random (0-4)</option>
                                </select>
                            </div>
                        </div>

                        <div style="padding: 16px 0; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border);">
                            <label class="toggle-switch" style="cursor: pointer;">
                                <input type="checkbox" id="show_browser" name="show_browser" {% if settings.show_browser %}checked{% endif %}>
                                <span class="slider"></span>
                                <span class="toggle-label" style="font-size: 0.95rem;">เปิดหน้าต่างเบราว์เซอร์อัตโนมัติ (Show Browser by Default)</span>
                            </label>
                            <p style="font-size: 0.8rem; color: var(--text-darker); margin-top: 6px; padding-left: 56px;">
                                หากปิดไว้ เบราว์เซอร์จะทำงานอยู่เบื้องหลังแบบซ่อนหน้าต่าง (Headless)
                            </p>
                        </div>

                        <div style="display: flex; gap: 12px; justify-content: flex-end; align-items: center; margin-top: 10px;">
                            <button type="submit" name="action" value="reset" class="btn-danger btn-sm" onclick="return confirm('คืนค่าเริ่มต้นทั้งหมดใช่หรือไม่?')">
                                คืนค่าเริ่มต้น
                            </button>
                            <button type="submit" name="action" value="save" class="btn-primary" style="padding: 10px 24px;">
                                บันทึกการตั้งค่า
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
